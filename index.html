<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <title>Frontend Mentor | Blog preview card</title>

</head>
<body>

  <main>
    <div class="container">
      <img class="articleImage" src="./assets/images/illustration-article.svg" alt="this is an illustration-article">
      <div class="content">

        <span class="category">Learning</span>
        <h4 class="date">Published 21 Dec 2023</h4>
        <h1 class="articleTitle">HTML & CSS foundations</h1>
        <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>
      <div class="author">
        <img class="authorAvatar" src="./assets/images/image-avatar.webp" alt="author avatar">
        <h4 class="authorName">Greg Hooper</h4>
      </div>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Sujinch</a>.
  </footer>
</body>
</html>
